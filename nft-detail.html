<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">NFT Detail - NiftyCord Marketplace</title>
    
    <!-- Discord Unfurl Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="NiftyCord">
    <meta property="og:title" id="og-title" content="NFT Detail - NiftyCord Marketplace">
    <meta property="og:description" id="og-description" content="View this NFT on the NiftyCord marketplace">
    <meta property="og:image" id="og-image" content="https://niftycord.com/assets/images/niftycord_logo_word.png">
    <meta property="og:url" id="og-url" content="">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@NiftyCord">
    <meta name="twitter:title" id="twitter-title" content="NFT Detail - NiftyCord Marketplace">
    <meta name="twitter:description" id="twitter-description" content="View this NFT on the NiftyCord marketplace">
    <meta name="twitter:image" id="twitter-image" content="https://niftycord.com/assets/images/niftycord_logo_word.png">
    
    <!-- Discord Specific Meta Tags -->
    <meta name="theme-color" content="#00D4AA">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/fontawesome/fontawesome.min.css">
    <link rel="stylesheet" href="assets/css/fontawesome/solid.min.css">
    <link rel="stylesheet" href="assets/css/fontawesome/brands.min.css">
    <link rel="stylesheet" href="assets/css/fontawesome/regular.min.css">
    <link rel="stylesheet" href="assets/css/animate.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        :root {
            --primary-color: #00D4AA;
            --secondary-color: #FF6B6B;
            --dark-bg: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --border-color: #404040;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-primary);
            font-family: 'Open Sans', sans-serif;
            margin: 0;
            padding: 0;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            width: 250px;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-color);
            z-index: 1000;
            padding: 20px;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
            padding: 10px 0;
        }

        .sidebar-logo img {
            width: 100%;
            max-width: 200px;
            height: auto;
        }

        .nav-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nav-menu li {
            margin-bottom: 10px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            color: var(--text-secondary);
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            background-color: rgba(0, 212, 170, 0.1);
            color: var(--primary-color);
        }

        .nav-link i {
            margin-right: 10px;
            width: 20px;
        }

        .main-content {
            margin-left: 250px;
            min-height: 100vh;
            padding: 20px;
        }

        .header-bar {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-container {
            position: relative;
            flex: 1;
            max-width: 400px;
        }

        .search-input {
            width: 100%;
            background-color: var(--dark-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 40px 12px 15px;
            color: var(--text-primary);
            font-size: 14px;
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn-action {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-action:hover {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }

        .nft-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .nft-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .nft-image-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
        }

        .nft-image {
            max-width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .nft-details {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
        }

        .nft-title {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--text-primary);
            margin-bottom: 20px;
        }

        .nft-description {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .nft-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background-color: var(--dark-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-copy {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-copy:hover {
            background: #00B894;
            transform: translateY(-2px);
        }

        .btn-discord {
            background: #7289da;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-discord:hover {
            background: #5b6eae;
            transform: translateY(-2px);
        }

        .btn-marketplace {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-marketplace:hover {
            background: #00B894;
            transform: translateY(-2px);
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .status-for-sale {
            background: rgba(0, 212, 170, 0.2);
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
        }

        .status-auction {
            background: rgba(255, 107, 107, 0.2);
            color: var(--secondary-color);
            border: 1px solid var(--secondary-color);
        }

        .status-sold {
            background: rgba(176, 176, 176, 0.2);
            color: var(--text-secondary);
            border: 1px solid var(--text-secondary);
        }

        .copy-success {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--primary-color);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 1000;
            display: none;
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
            }

            .nft-content {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .nft-stats {
                grid-template-columns: 1fr;
            }

            .action-buttons {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            <img src="assets/images/niftycord_logo_word.png" alt="NiftyCord" style="width: 100%; max-width: 200px;">
        </div>
        <ul class="nav-menu">
            <li><a href="index.html" class="nav-link"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="marketplace.html" class="nav-link"><i class="fas fa-store"></i> Marketplace</a></li>
            <li><a href="#" class="nav-link"><i class="fas fa-chart-line"></i> Prices</a></li>
            <li><a href="#" class="nav-link active"><i class="fas fa-gem"></i> NFTs/Items/Assets</a></li>
            <li><a href="#" class="nav-link"><i class="fas fa-tags"></i> Promotions</a></li>
            <li><a href="#" class="nav-link"><i class="fas fa-history"></i> Activities</a></li>
            <li><a href="#" class="nav-link"><i class="fas fa-bell"></i> Notifications</a></li>
            <li><a href="#" class="nav-link"><i class="fas fa-cog"></i> Settings</a></li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Header Bar -->
        <div class="header-bar">
            <div class="search-container">
                <input type="text" class="search-input" placeholder="Search NFTs, collections, or user!" id="searchInput">
                <i class="fas fa-search search-icon"></i>
            </div>
            <div class="header-actions">
                <button class="btn-action">
                    <i class="fas fa-bell"></i>
                </button>
                <button class="btn-action">
                    <i class="fas fa-download"></i>
                </button>
                <select class="btn-action" style="background-color: var(--card-bg); border: 1px solid var(--border-color);">
                    <option>DOT/USD</option>
                    <option>DOT/EUR</option>
                    <option>DOT/BTC</option>
                </select>
                <button class="btn-action">
                    <i class="fas fa-shield-alt"></i>
                </button>
            </div>
        </div>

        <!-- NFT Container -->
        <div class="nft-container">
            <!-- NFT Content -->
            <div class="nft-content">
                <!-- Image Section -->
                <div class="nft-image-section">
                    <img id="nft-image" src="assets/images/niftycord_logo_word.png" alt="NFT Image" class="nft-image">
                </div>
                
                <!-- Details Section -->
                <div class="nft-details">
                    <div id="status-badge" class="status-badge status-for-sale">🟢 For Sale</div>
                    <h2 id="nft-title" class="nft-title">Loading...</h2>
                    <p id="nft-description" class="nft-description">Loading description...</p>
                    
                    <div class="nft-stats">
                        <div class="stat-card">
                            <div id="nft-price" class="stat-value">Loading...</div>
                            <div class="stat-label">Price</div>
                        </div>
                        <div class="stat-card">
                            <div id="nft-id" class="stat-value">Loading...</div>
                            <div class="stat-label">NFT ID</div>
                        </div>
                        <div class="stat-card">
                            <div id="nft-owner" class="stat-value">Loading...</div>
                            <div class="stat-label">Owner</div>
                        </div>
                        <div class="stat-card">
                            <div id="nft-watchers" class="stat-value">0</div>
                            <div class="stat-label">Watchers</div>
                        </div>
                    </div>
                    
                    <div class="action-buttons">
                        <button id="copy-link-btn" class="btn-copy">
                            <i class="fas fa-copy"></i> Copy Link
                        </button>
                        <button id="copy-discord-btn" class="btn-discord">
                            <i class="fab fa-discord"></i> Copy Discord Link
                        </button>
                        <button id="marketplace-btn" class="btn-marketplace">
                            <i class="fas fa-store"></i> View Marketplace
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Copy Success Message -->
        <div id="copy-success" class="copy-success">
            <i class="fas fa-check"></i> Link copied to clipboard!
        </div>
    </div>

    <script>
        // Get NFT ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const nftId = urlParams.get('id');
        
        // API base URL - use GitHub Pages for production
        const API_BASE = window.location.hostname === 'niftycordgithubio-production.up.railway.app' ? 'https://niftycordgithubio-production.up.railway.app' : 'http://localhost:3001';
        
        // Load NFT data
        async function loadNFTData() {
            if (!nftId) {
                document.getElementById('nft-title').textContent = 'NFT not found';
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/nfts/${nftId}`);
                const result = await response.json();
                
                if (!result.success) {
                    throw new Error(result.error || 'Failed to fetch NFT');
                }
                
                const nft = result.data;
                
                // Update page title (only if element exists)
                const pageTitle = `${nft.name || 'Unnamed NFT'} - NiftyCord Marketplace`;
                const pageTitleElement = document.getElementById('page-title');
                if (pageTitleElement) {
                    pageTitleElement.textContent = pageTitle;
                }
                
                // Update NFT details (only if elements exist)
                const nftTitleElement = document.getElementById('nft-title');
                if (nftTitleElement) {
                    nftTitleElement.textContent = nft.name || 'Unnamed NFT';
                }
                
                const nftDescriptionElement = document.getElementById('nft-description');
                if (nftDescriptionElement) {
                    nftDescriptionElement.textContent = nft.description || 'No description available';
                }
                
                const nftPriceElement = document.getElementById('nft-price');
                if (nftPriceElement) {
                    nftPriceElement.textContent = nft.price ? `${nft.price} DOT` : 'Not for sale';
                }
                
                const nftIdElement = document.getElementById('nft-id');
                if (nftIdElement) {
                    nftIdElement.textContent = nftId;
                }
                
                const nftOwnerElement = document.getElementById('nft-owner');
                if (nftOwnerElement) {
                    nftOwnerElement.textContent = nft.owner?.username || 'Unknown';
                }
                
                const nftWatchersElement = document.getElementById('nft-watchers');
                if (nftWatchersElement) {
                    nftWatchersElement.textContent = nft.watchers || '0';
                }
                
                // Update image (only if element exists)
                if (nft.image) {
                    const nftImageElement = document.getElementById('nft-image');
                    if (nftImageElement) {
                        nftImageElement.src = nft.image;
                    }
                }
                
                // Update Discord unfurl meta tags
                updateDiscordMetaTags(nft, nftId);
                
                // Update status badge (only if element exists)
                const statusBadge = document.getElementById('status-badge');
                if (statusBadge) {
                    if (nft.isForSale) {
                        statusBadge.textContent = '🟢 For Sale';
                        statusBadge.className = 'status-badge status-for-sale';
                    } else if (nft.status === 'auction') {
                        statusBadge.textContent = '🔴 Live Auction';
                        statusBadge.className = 'status-badge status-auction';
                    } else if (nft.status === 'sold') {
                        statusBadge.textContent = '🔵 Sold';
                        statusBadge.className = 'status-badge status-sold';
                    } else {
                        statusBadge.textContent = '⚪ Not Listed';
                        statusBadge.className = 'status-badge status-not-listed';
                    }
                }
                
            } catch (error) {
                console.error('Error loading NFT data:', error);
                const nftTitleElement = document.getElementById('nft-title');
                if (nftTitleElement) {
                    nftTitleElement.textContent = 'Error loading NFT';
                }
                const nftDescriptionElement = document.getElementById('nft-description');
                if (nftDescriptionElement) {
                    nftDescriptionElement.textContent = 'Failed to load NFT data. Please try again later.';
                }
            }
        }
        
        // Copy functions
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showCopySuccess();
            }).catch(err => {
                console.error('Failed to copy: ', err);
                // Fallback for older browsers
                const textArea = document.createElement('textarea');
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                showCopySuccess();
            });
        }
        
        function showCopySuccess() {
            const successMsg = document.getElementById('copy-success');
            successMsg.style.display = 'block';
            setTimeout(() => {
                successMsg.style.display = 'none';
            }, 3000);
        }
        
        // Event listeners
        document.getElementById('copy-link-btn').addEventListener('click', () => {
            const currentUrl = window.location.href;
            copyToClipboard(currentUrl);
        });
        
        document.getElementById('copy-discord-btn').addEventListener('click', () => {
            const discordUrl = `${window.location.origin}/nft-detail.html?id=${nftId}`;
            copyToClipboard(discordUrl);
        });
        
        document.getElementById('marketplace-btn').addEventListener('click', () => {
            window.location.href = 'marketplace.html';
        });
        
        // Update Discord unfurl meta tags
        function updateDiscordMetaTags(nft, nftId) {
            const currentUrl = window.location.href;
            const nftName = nft.name || 'Unnamed NFT';
            const nftDescription = nft.description || 'View this NFT on the NiftyCord marketplace';
            const nftImage = nft.image || 'https://niftycord.com/assets/images/niftycord_logo_word.png';
            const nftPrice = nft.price ? `${nft.price} DOT` : 'Not for sale';
            
            // Update Open Graph tags
            document.getElementById('og-title').setAttribute('content', `${nftName} - NiftyCord Marketplace`);
            document.getElementById('og-description').setAttribute('content', `${nftDescription} | Price: ${nftPrice}`);
            document.getElementById('og-image').setAttribute('content', nftImage);
            document.getElementById('og-url').setAttribute('content', currentUrl);
            
            // Update Twitter Card tags
            document.getElementById('twitter-title').setAttribute('content', `${nftName} - NiftyCord Marketplace`);
            document.getElementById('twitter-description').setAttribute('content', `${nftDescription} | Price: ${nftPrice}`);
            document.getElementById('twitter-image').setAttribute('content', nftImage);
            
            // Update page title
            document.title = `${nftName} - NiftyCord Marketplace`;
        }
        
        // Mobile sidebar toggle
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('open');
        }

        // Load data when page loads
        document.addEventListener('DOMContentLoaded', loadNFTData);
    </script>
</body>
</html>
